<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UtahQDRO Logo Concepts</title>
    <style>
      :root {
        color: #162033;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #f4f7fb;
      }
      body {
        margin: 0;
        padding: 32px 20px 64px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 28px;
        color: #667085;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        max-width: 1200px;
      }
      figure {
        margin: 0;
        background: #fff;
        border: 1px solid #d9e1ec;
        border-radius: 12px;
        overflow: hidden;
      }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
        background: #fff;
        padding: 16px;
        box-sizing: border-box;
      }
      figcaption {
        padding: 14px 16px 16px;
        border-top: 1px solid #eef2f7;
        font-weight: 700;
      }
      figcaption span {
        display: block;
        margin-top: 4px;
        font-weight: 500;
        color: #667085;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>UtahQDRO logo concepts</h1>
    <p>Pick a number and tell me which one to refine for the site.</p>
    <div class="grid">
      <figure>
        <img src="./utahqdro-logo-01-qd-shield.png" alt="Logo concept 1 QD Shield" />
        <figcaption>1. QD Shield<span>Classic legal monogram</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-02-arch-monogram.png" alt="Logo concept 2 Arch Seal" />
        <figcaption>2. Arch Seal<span>QD circle with Utah detail</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-03-split-wordmark.png" alt="Logo concept 3 Split Wordmark" />
        <figcaption>3. Split Wordmark<span>Teal Utah + navy QDRO</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-04-redrock-qd.png" alt="Logo concept 4 Red Rock QD" />
        <figcaption>4. Red Rock QD<span>Desert butte with QD cutout</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-05-balance-scale.png" alt="Logo concept 5 Balance Scale" />
        <figcaption>5. Balance + Division<span>Scale fused with pie chart</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-06-stacked-badge.png" alt="Logo concept 6 Stacked Badge" />
        <figcaption>6. Stacked Badge<span>QD tile over Utah / QDRO</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-07-document-stamp.png" alt="Logo concept 7 Document Stamp" />
        <figcaption>7. Document Stamp<span>Order + QD seal</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-08-interlocked-u.png" alt="Logo concept 8 Interlocked U" />
        <figcaption>8. Interlocked U+Q<span>Custom monogram</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-09-horizon-line.png" alt="Logo concept 9 Horizon Line" />
        <figcaption>9. Horizon Line<span>Wordmark with mountain underline</span></figcaption>
      </figure>
      <figure>
        <img src="./utahqdro-logo-10-modern-q.png" alt="Logo concept 10 Modern Q" />
        <figcaption>10. Modern Q Check<span>Q with checkmark tail</span></figcaption>
      </figure>
    </div>
  </body>
</html>
